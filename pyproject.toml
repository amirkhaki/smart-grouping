[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-grouping"
version = "0.1.0"
description = "Latent Slice Classification Benchmarking on Frozen ELIC"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools]
packages = [
    "benchmarks",
    "benchmarks.models",
    "benchmarks.datasets",
    "ELICUtilis",
    "ELICUtilis.layers",
    "ELICUtilis.datasets",
    "ELICUtilis.utilis",
]
py-modules = ["Network", "train", "Inference", "updata"]

[project.scripts]
elic-cache = "benchmarks.cache_latents:main"
elic-train = "benchmarks.train_probe:main"
elic-download = "benchmarks.download_checkpoints:main"
