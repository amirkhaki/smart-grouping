name: "Run on Kaggle"
description: >
  Pushes ci/kaggle_runner.py as a Kaggle script kernel, executes the target command
  on Kaggle GPUs, polls status, downloads outputs, and uploads GitHub artifacts.
  Includes automated disk cleanup for large .h5 files on the runner.

inputs:
  kaggle_owner:
    description: "Kaggle username"
    required: true
  kaggle_token:
    description: "Kaggle API token (secrets.KAGGLE_API_TOKEN)"
    required: true
  slug:
    description: "Kernel slug / title"
    required: true
  command:
    description: "Shell command to execute on Kaggle, cwd=/kaggle/working"
    required: true
  enable_gpu:
    description: "'true' or 'false'"
    default: "true"
  dataset_sources:
    description: 'JSON list of "owner/slug" Kaggle Datasets to attach'
    default: "[]"
  kernel_sources:
    description: 'JSON list of "owner/slug" Kaggle Notebooks whose output to attach'
    default: "[]"
  artifact_name:
    description: "Name for the uploaded GitHub artifact"
    required: true
  artifact_paths:
    description: "Paths for actions/upload-artifact"
    default: "out/"

runs:
  using: "composite"
  steps:
    - name: Install Kaggle CLI
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "kaggle>=1.8.2" six

    - name: Check credentials
      shell: bash
      env:
        HAVE_TOKEN: ${{ inputs.kaggle_token != '' }}
        KAGGLE_OWNER: ${{ inputs.kaggle_owner }}
      run: |
        [ "$HAVE_TOKEN" = "true" ] || { echo "::error::KAGGLE_API_TOKEN was not passed (repo secret missing?)"; exit 1; }
        [ -n "$KAGGLE_OWNER" ] || { echo "::error::KAGGLE_USERNAME variable/secret is not set"; exit 1; }

    - name: Build kernel bundle
      shell: bash
      env:
        KAGGLE_OWNER: ${{ inputs.kaggle_owner }}
        SLUG: ${{ inputs.slug }}
        IN_COMMAND: ${{ inputs.command }}
        ENABLE_GPU: ${{ inputs.enable_gpu }}
        DATASET_SOURCES: ${{ inputs.dataset_sources }}
        KERNEL_SOURCES: ${{ inputs.kernel_sources }}
      run: |
        mkdir -p kaggle_push
        python - <<'PY'
        import json, os, pathlib, pprint
        cfg = {
            "repo": os.environ["GITHUB_REPOSITORY"],
            "sha": os.environ["GITHUB_SHA"],
            "ref": os.environ["GITHUB_REF_NAME"],
            "github_run_id": os.environ["GITHUB_RUN_ID"],
            "command": os.environ["IN_COMMAND"],
        }
        src = pathlib.Path("ci/kaggle_runner.py").read_text()
        pathlib.Path("kaggle_push/script.py").write_text(
            "RUN_CONFIG = " + pprint.pformat(cfg) + "\n\n" + src
        )
        meta = {
            "id": os.environ["KAGGLE_OWNER"] + "/" + os.environ["SLUG"],
            "title": os.environ["SLUG"],
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": "true",
            "enable_gpu": os.environ["ENABLE_GPU"],
            "enable_internet": "true",
            "dataset_sources": json.loads(os.environ["DATASET_SOURCES"]),
            "competition_sources": [],
            "kernel_sources": json.loads(os.environ["KERNEL_SOURCES"]),
            "model_sources": [],
        }
        pathlib.Path("kaggle_push/kernel-metadata.json").write_text(json.dumps(meta, indent=2))
        PY

    - name: Check previous run status
      shell: bash
      env:
        KAGGLE_API_TOKEN: ${{ inputs.kaggle_token }}
        KAGGLE_KEY: ${{ inputs.kaggle_token }}
        KAGGLE_USERNAME: ${{ inputs.kaggle_owner }}
        KAGGLE_OWNER: ${{ inputs.kaggle_owner }}
        SLUG: ${{ inputs.slug }}
      run: |
        st=$(kaggle kernels status "$KAGGLE_OWNER/$SLUG" 2>&1 || true)
        echo "$st"
        state=$(sed -nE 's/.*has status "?([A-Za-z_.]+)"?.*/\1/p' <<<"$st" | head -1 | sed 's/.*\.//' | tr a-z A-Z || true)
        if [ "$state" = RUNNING ] || [ "$state" = QUEUED ]; then
          echo "::error::A previous run of $KAGGLE_OWNER/$SLUG is still active."
          exit 1
        fi

    - name: Push kernel
      shell: bash
      env:
        KAGGLE_API_TOKEN: ${{ inputs.kaggle_token }}
        KAGGLE_KEY: ${{ inputs.kaggle_token }}
        KAGGLE_USERNAME: ${{ inputs.kaggle_owner }}
      run: kaggle kernels push -p kaggle_push

    - name: Wait for Kaggle execution and retrieve output
      shell: bash
      env:
        KAGGLE_API_TOKEN: ${{ inputs.kaggle_token }}
        KAGGLE_KEY: ${{ inputs.kaggle_token }}
        KAGGLE_USERNAME: ${{ inputs.kaggle_owner }}
        KAGGLE_OWNER: ${{ inputs.kaggle_owner }}
        SLUG: ${{ inputs.slug }}
      run: |
        ID="$KAGGLE_OWNER/$SLUG"
        mkdir -p out
        seen_active=0
        unknown=0
        SECONDS=0
        sleep 45
        while :; do
          st=$(kaggle kernels status "$ID" 2>&1 || true)
          echo "[$(date -u +%H:%M:%S)] $st"
          state=$(sed -nE 's/.*has status "?([A-Za-z_.]+)"?.*/\1/p' <<<"$st" | head -1 | sed 's/.*\.//' | tr a-z A-Z || true)
          if [ -z "$state" ]; then
            unknown=$((unknown + 1))
            if [ "$unknown" -ge 10 ]; then
              echo "::error::Cannot read run status from Kaggle CLI. Last output: $st"
              exit 1
            fi
          else
            unknown=0
          fi

          case "$state" in
            RUNNING|QUEUED)
              seen_active=1
              ;;
            COMPLETE|ERROR|CANCEL_REQUESTED|CANCEL_ACKNOWLEDGED)
              rm -rf out && mkdir out
              kaggle kernels output "$ID" -p out || true
              # Delete large .h5 cache file immediately to protect runner disk space
              rm -f out/*.h5
              if [ "$(jq -r .github_run_id out/run_meta.json 2>/dev/null)" = "$GITHUB_RUN_ID" ]; then
                if [ "$state" = "COMPLETE" ]; then exit 0; fi
                echo "::error::Kaggle run ended with $state"
                exit 1
              fi
              if [ "$seen_active" = 1 ] || [ "$SECONDS" -gt 900 ]; then
                echo "::error::Kaggle run ended ($state) without matching run_meta.json"
                exit 1
              fi
              echo "Status appears stale (from previous run), waiting..."
              ;;
          esac
          sleep 60
        done

    - name: Job Summary
      shell: bash
      if: always()
      env:
        IN_COMMAND: ${{ inputs.command }}
        SLUG: ${{ inputs.slug }}
      run: |
        {
          echo "### Kaggle Run: $SLUG"
          echo "- commit: \`$GITHUB_SHA\` (\`$GITHUB_REF_NAME\`)"
          echo "- command: \`$IN_COMMAND\`"
          if [ -f out/run_meta.json ]; then
            echo '```json'; cat out/run_meta.json; echo; echo '```'
          fi
          if [ -f out/master_results.csv ]; then
            echo "#### master_results.csv"
            echo '```'; cat out/master_results.csv; echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.artifact_paths }}
        if-no-files-found: warn
